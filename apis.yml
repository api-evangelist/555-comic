name: 555 Comic
description: >-
  555 Comic is an interactive storytelling and virtual-influencer studio founded
  by Ben Watanabe. It runs casts of anime-styled virtual characters — such as
  @CRC_Luna — who publish real-time alternate-reality-game (ARG) stories across
  TikTok, Twitter/X and Instagram, letting fans create original characters (OCs)
  and interact with official storylines across four interconnected fictional
  worlds: Conspiracy Research Club, All Night Arcade, The Convenience Store, and
  a Paranormal Research Club. Stories unfold in real time on "Poppy-valley
  Standard Time," with fans participating through social comments. 555 Comic is a
  Techstars Music portfolio company. It publishes no public developer API,
  OpenAPI, or documentation surface; this profile captures its identity and a
  domain-security probe of its web host.
